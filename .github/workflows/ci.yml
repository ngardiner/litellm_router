name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Code formatting check (Black)
      run: black --check --diff .
    
    - name: Import sorting check (isort)
      run: isort --check-only --diff .
    
    - name: Linting (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Type checking (mypy)
      run: mypy routing/ web_interface/
      continue-on-error: true
    
    - name: Security linting (bandit)
      run: bandit -r routing/ web_interface/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  test-matrix:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_litellm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Initialize test database
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        python -c "from routing.database.schema import init_database; init_database()"
    
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        pytest tests/unit/ -v --cov=routing --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        pytest tests/integration/ -v --cov=routing --cov-append --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Prepare build context
      run: |
        # Copy routing module into web_interface for Docker build
        cp -r ./routing ./web_interface/routing
    
    - name: Build web interface image
      uses: docker/build-push-action@v5
      with:
        context: ./web_interface
        push: false
        tags: litellm-router-web:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test docker-compose configuration
      run: |
        # Create minimal test environment
        echo "POSTGRES_PASSWORD=test123" > .env
        docker-compose -f docker-compose.test.yml config

  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [code-quality, test-matrix]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_litellm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install locust
    
    - name: Initialize database
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        python -c "from routing.database.schema import init_database; init_database()"
        python -c "from routing.router import auto_discover_and_register_modules; auto_discover_and_register_modules()"
    
    - name: Start web interface
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        cd web_interface
        uvicorn app:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Run performance tests
      run: |
        # Basic load test
        curl -f http://localhost:8000/api/health
        echo "Basic health check passed"
    
    - name: Benchmark routing performance
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_litellm
      run: |
        python -c "
        from routing.router import switchboard
        import time
        
        # Benchmark switchboard performance
        start_time = time.time()
        for i in range(100):
            result = switchboard('test-model', [{'role': 'user', 'content': 'test'}])
        end_time = time.time()
        
        avg_time = (end_time - start_time) / 100
        print(f'Average switchboard time: {avg_time:.4f}s')
        
        # Fail if too slow
        if avg_time > 0.1:
            print('WARNING: Switchboard performance degraded')
            exit(1)
        "

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
    
    - name: Validate documentation
      run: |
        # Check that all referenced files exist
        echo "Validating documentation structure..."
        
        # Check README links
        if grep -q "docs/" README.md; then
          echo "README references docs directory"
        fi
        
        # Validate Python imports in documentation
        python -c "
        import sys
        sys.path.append('.')
        try:
            import routing
            print('Routing module imports successfully')
        except Exception as e:
            print(f'Import error: {e}')
            sys.exit(1)
        "

  integration-test:
    name: End-to-End Integration
    runs-on: ubuntu-latest
    needs: [docker-build]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Start test stack
      run: |
        echo "POSTGRES_PASSWORD=test123" > .env
        docker-compose -f docker-compose.test.yml up -d
        sleep 30
    
    - name: Wait for services
      run: |
        # Wait for web interface to be ready
        for i in {1..30}; do
          if curl -f http://localhost:8001/api/health; then
            echo "Web interface is ready"
            break
          fi
          echo "Waiting for web interface... ($i/30)"
          sleep 2
        done
    
    - name: Test API endpoints
      run: |
        # Test health endpoint
        curl -f http://localhost:8001/api/health
        
        # Test routing rules endpoint
        curl -f http://localhost:8001/api/routing-rules
        
        # Test modules endpoint
        curl -f http://localhost:8001/api/modules
        
        # Test stats endpoint
        curl -f http://localhost:8001/api/stats
        
        echo "All API endpoints responding correctly"
    
    - name: Test routing functionality
      run: |
        # Test module discovery
        curl -X POST http://localhost:8001/api/modules/discover
        
        # Create a test routing rule
        curl -X POST http://localhost:8001/api/routing-rules \
          -H "Content-Type: application/json" \
          -d '{
            "model_name": "test-model",
            "module_name": "openrouter_free",
            "enabled": true,
            "priority": 0
          }'
        
        # Verify the rule was created
        curl -f http://localhost:8001/api/routing-rules | grep "test-model"
        
        echo "Routing functionality working correctly"
    
    - name: Cleanup
      if: always()
      run: |
        docker-compose -f docker-compose.test.yml down -v

  notification:
    name: Build Status Notification
    runs-on: ubuntu-latest
    needs: [code-quality, test-matrix, docker-build, performance-test, documentation, integration-test]
    if: always()
    
    steps:
    - name: Determine overall status
      id: status
      run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
          echo "status=failure" >> $GITHUB_OUTPUT
        elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
          echo "status=cancelled" >> $GITHUB_OUTPUT
        else
          echo "status=success" >> $GITHUB_OUTPUT
        fi
    
    - name: Report status
      run: |
        echo "Overall CI Status: ${{ steps.status.outputs.status }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Test Matrix: ${{ needs.test-matrix.result }}"
        echo "Docker Build: ${{ needs.docker-build.result }}"
        echo "Performance: ${{ needs.performance-test.result }}"
        echo "Documentation: ${{ needs.documentation.result }}"
        echo "Integration: ${{ needs.integration-test.result }}"