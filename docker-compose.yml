version: '3.8'

services:
  # PostgreSQL Database
  litellm_db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LiteLLM Service
  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    restart: always
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@litellm_db:5432/litellm
    ports:
      - "4060:4000"
    volumes:
      - ./routing:/app/config/routing
      - ./litellm_config:/app/config/
    entrypoint: ["/bin/sh", "/app/config/litellm/entrypoint.sh"]
    depends_on:
      litellm_db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

  # LiteLLM Router Web Interface
  litellm_router_web:
    build: ./web_interface
    restart: always
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@litellm_db:5432/litellm
    ports:
      - "4061:8000"
    volumes:
      - ./routing:/app/routing:ro
    depends_on:
      litellm_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

volumes:
  postgres_data: